<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#FAF6F0" media="(prefers-color-scheme: light)" id="meta-theme-light" />
<meta name="theme-color" content="#1A1614" media="(prefers-color-scheme: dark)" id="meta-theme-dark" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pillpal" />
<meta name="description" content="A gentle medication tracker with reminders." />
<title>Pillpal</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAF6F0;
    --bg-2: #F3ECE2;
    --card: #FFFFFF;
    --ink: #2D2520;
    --ink-2: #7A6B5E;
    --ink-3: #B5A89C;
    --line: #EAE0D2;
    --primary: #D97757;
    --primary-ink: #B85C3D;
    --primary-soft: #FCE7DD;
    --yellow: #F5C76A;
    --yellow-soft: #FDF1D6;
    --sage: #7FA88F;
    --sage-soft: #E2EEDF;
    --sky: #8FB8C9;
    --sky-soft: #DEEAEF;
    --lilac: #B7A4C7;
    --lilac-soft: #ECE4F2;
    --rose: #D98F94;
    --rose-soft: #F6DEDF;
    --shadow: 0 1px 2px rgba(70,46,28,.04), 0 8px 24px rgba(70,46,28,.06);
    --shadow-lg: 0 4px 12px rgba(70,46,28,.06), 0 24px 48px rgba(70,46,28,.10);
    --radius: 18px;
    --radius-lg: 24px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    /* Semantic */
    --tabs-bg: rgba(255,255,255,.85);
    --banner-warn-border: #F0DBA8;
    --banner-warn-ink: #6B4F1A;
    --banner-info-border: #BFD4DC;
    --banner-info-ink: #3D6675;
    --danger-ink: #A8525A;
    --blob-1: var(--primary-soft);
    --blob-2: var(--yellow-soft);
  }

  [data-theme="dark"] {
    --bg: #1A1614;
    --bg-2: #221C18;
    --card: #2A231E;
    --ink: #F2EAE0;
    --ink-2: #A89B8E;
    --ink-3: #6B5F54;
    --line: #3A3128;
    --primary: #E8956C;
    --primary-ink: #F0A88A;
    --primary-soft: #3D2A22;
    --yellow: #F5C76A;
    --yellow-soft: #3A2F1A;
    --sage: #8FB89F;
    --sage-soft: #1F2D24;
    --sky: #8FB8C9;
    --sky-soft: #1E2B30;
    --lilac: #B7A4C7;
    --lilac-soft: #2A2330;
    --rose: #D98F94;
    --rose-soft: #322023;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.3), 0 24px 48px rgba(0,0,0,.45);

    --tabs-bg: rgba(26,22,20,.85);
    --banner-warn-border: #5A4624;
    --banner-warn-ink: #EBC97A;
    --banner-info-border: #345560;
    --banner-info-ink: #9BC5D4;
    --danger-ink: #E89AA1;
    --blob-1: #3D2A22;
    --blob-2: #2D2517;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior-y: contain; }
  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 16px;
    line-height: 1.5;
  }

  /* Decorative background blobs for warmth */
  body::before, body::after {
    content: '';
    position: fixed; pointer-events: none; z-index: 0;
    width: 60vw; height: 60vw; border-radius: 50%;
    filter: blur(80px); opacity: .35;
  }
  body::before { top: -20vw; right: -20vw; background: var(--blob-1); }
  body::after { bottom: -25vw; left: -25vw; background: var(--blob-2); }

  #app {
    position: relative; z-index: 1;
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: calc(96px + var(--safe-bottom));
    max-width: 560px; margin: 0 auto;
  }

  /* Header */
  header.top {
    padding: 22px 22px 8px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  header.top .hello {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 13px;
    color: var(--ink-2);
    letter-spacing: .02em;
    margin-bottom: 2px;
  }
  header.top h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-variation-settings: 'opsz' 144, 'SOFT' 100;
    font-size: 30px;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -.01em;
  }
  header.top .icon-btn {
    width: 44px; height: 44px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    display: grid; place-items: center;
    box-shadow: var(--shadow); cursor: pointer;
    color: var(--ink-2);
  }
  header.top .icon-btn:active { transform: scale(.95); }

  /* Page transitions */
  .view { display: none; padding: 12px 18px 16px; animation: rise .35s ease both; }
  .view.active { display: block; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Cards */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 12px; }

  .section-title {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .14em;
    color: var(--ink-2);
    margin: 18px 4px 10px;
  }

  /* Today summary */
  .day-strip {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 6px; margin: 10px 0 18px;
  }
  .day-cell {
    aspect-ratio: 1 / 1.25;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700;
    cursor: pointer;
  }
  .day-cell .dow { font-size: 11px; color: var(--ink-2); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .day-cell .dom { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; margin-top: 2px; }
  .day-cell.today {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .day-cell.today .dow { color: rgba(255,255,255,.7); }
  .day-cell.has-doses::after {
    content: ''; width: 4px; height: 4px; border-radius: 50%;
    background: var(--primary); margin-top: 4px;
  }
  .day-cell.today.has-doses::after { background: var(--yellow); }

  /* Dose item */
  .dose {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform .15s ease;
  }
  .dose + .dose { margin-top: 10px; }
  .dose:active { transform: scale(.99); }

  .pill-icon {
    width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--primary-soft);
    flex-shrink: 0;
    position: relative;
  }
  .pill-icon svg { width: 26px; height: 26px; }

  .dose-meta { flex: 1; min-width: 0; }
  .dose-meta .name {
    font-weight: 700; font-size: 16px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dose-meta .sub {
    font-size: 13px; color: var(--ink-2); margin-top: 2px;
    display: flex; align-items: center; gap: 6px;
  }
  .dose-meta .sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-3); }

  .dose-time {
    font-family: 'Fraunces', serif;
    font-weight: 500; font-size: 15px;
    color: var(--ink);
    background: var(--bg-2);
    padding: 6px 10px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .check {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
    color: transparent;
    transition: all .2s ease;
  }
  .check:active { transform: scale(.9); }

  .skip-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 2px solid var(--line);
    background: transparent;
    display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
    color: var(--ink-3);
    transition: all .2s ease;
    margin-right: -4px;
  }
  .skip-btn:active { transform: scale(.9); }
  .skip-btn:hover { color: var(--danger-ink); border-color: var(--rose); }
  .skip-btn svg { width: 14px; height: 14px; }
  .dose.taken .skip-btn, .dose.skipped .skip-btn { display: none; }

  .dose.taken .check {
    background: var(--sage); border-color: var(--sage); color: white;
  }
  .dose.taken .pill-icon { opacity: .55; }
  .dose.taken .name, .dose.taken .sub, .dose.taken .dose-time { opacity: .6; }
  .dose.taken .name { text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .dose.missed .check { border-color: var(--rose); }
  .dose.missed .dose-time { background: var(--rose-soft); color: var(--danger-ink); }
  .dose.skipped { opacity: .55; }
  .dose.skipped .check { border-style: dashed; }
  .dose.skipped .dose-time { background: var(--bg-2); color: var(--ink-3); text-decoration: line-through; }

  /* PRN (as-needed) card */
  .prn-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px;
    box-shadow: var(--shadow); margin-bottom: 10px;
  }
  .prn-top {
    display: flex; align-items: center; gap: 12px;
  }
  .prn-top .pill-icon { flex-shrink: 0; }
  .prn-info { flex: 1; min-width: 0; }
  .prn-info .name {
    font-weight: 700; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .prn-info .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .prn-take {
    flex-shrink: 0;
    padding: 10px 16px; border-radius: 12px;
    background: var(--primary); color: white;
    border: none; font-family: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer; min-width: 78px;
    box-shadow: 0 2px 6px rgba(217,119,87,.3);
  }
  .prn-take:active { transform: scale(.96); }
  .prn-take.disabled, .prn-take:disabled {
    background: var(--bg-2); color: var(--ink-3);
    box-shadow: none; cursor: not-allowed;
  }
  .prn-take.waiting { background: var(--yellow); color: #6B4F1A; box-shadow: none; }
  .prn-bottom {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 700;
    letter-spacing: .04em;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-pill.ready { background: var(--sage-soft); color: var(--sage); }
  .status-pill.waiting { background: var(--yellow-soft); color: #B9882C; }
  [data-theme="dark"] .status-pill.waiting { color: var(--yellow); }
  .status-pill.locked { background: var(--bg-2); color: var(--ink-2); }
  .prn-meta { font-size: 12px; color: var(--ink-2); }

  /* Type selector at top of form */
  .type-select {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 4px; background: var(--bg-2); border-radius: 13px;
    margin-bottom: 14px;
  }
  .type-opt {
    border: none; background: transparent;
    padding: 12px 10px; border-radius: 10px;
    font-family: inherit; font-weight: 700; font-size: 14px;
    color: var(--ink-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .type-opt svg { width: 16px; height: 16px; }
  .type-opt.on {
    background: var(--card); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.05);
  }
  [data-theme="dark"] .type-opt.on {
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
  }

  /* Empty states */
  .empty {
    text-align: center; padding: 48px 24px;
    color: var(--ink-2);
  }
  .empty .blob {
    width: 110px; height: 110px; margin: 0 auto 16px;
    background: var(--yellow-soft); border-radius: 50%;
    display: grid; place-items: center;
    position: relative;
  }
  .empty .blob::before {
    content: ''; position: absolute; inset: -8px;
    border-radius: 50%; background: var(--primary-soft);
    z-index: -1; transform: translate(8px, 8px);
  }
  .empty .blob svg { width: 56px; height: 56px; }
  .empty h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500; font-size: 22px; color: var(--ink); margin: 0 0 6px;
  }
  .empty p { margin: 0; font-size: 15px; }

  /* Medications list */
  .med-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 10px;
  }
  .med-row:active { transform: scale(.99); }
  .med-row .pill-icon { width: 50px; height: 50px; border-radius: 16px; }
  .med-row .meta { flex: 1; min-width: 0; }
  .med-row .meta .name { font-weight: 700; font-size: 16px; }
  .med-row .meta .sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .med-row .chev { color: var(--ink-3); }

  /* FAB */
  .fab {
    position: fixed; right: max(18px, env(safe-area-inset-right));
    bottom: calc(96px + var(--safe-bottom));
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--primary); color: white;
    border: none;
    box-shadow: 0 8px 20px rgba(217,119,87,.45);
    display: grid; place-items: center;
    cursor: pointer;
    z-index: 30;
  }
  .fab:active { transform: scale(.93); }
  .fab svg { width: 24px; height: 24px; }

  /* Bottom tabs */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--tabs-bg);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + var(--safe-bottom));
    display: grid; grid-template-columns: repeat(4, 1fr);
    z-index: 40;
  }
  nav.tabs button {
    background: none; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 8px 4px;
    color: var(--ink-3); cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: .02em;
    border-radius: 14px;
    transition: color .2s;
  }
  nav.tabs button svg { width: 24px; height: 24px; }
  nav.tabs button.active { color: var(--primary); }
  nav.tabs button:active { background: var(--bg-2); }

  /* Sheet (bottom modal) */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(45,37,32,.4);
    opacity: 0; pointer-events: none; transition: opacity .25s;
    z-index: 50; backdrop-filter: blur(2px);
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--bg);
    border-top-left-radius: 28px; border-top-right-radius: 28px;
    padding: 8px 20px calc(24px + var(--safe-bottom));
    transform: translateY(100%); transition: transform .35s cubic-bezier(.2,.7,.2,1);
    max-height: 92vh; overflow-y: auto;
    max-width: 560px; margin: 0 auto;
    box-shadow: 0 -16px 40px rgba(70,46,28,.18);
  }
  .sheet.open { transform: translateY(0); }
  .sheet .grabber {
    width: 44px; height: 5px; border-radius: 3px;
    background: var(--ink-3); opacity: .4;
    margin: 6px auto 14px;
  }
  .sheet h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500; font-size: 24px;
    margin: 0 0 6px;
  }
  .sheet .lede { color: var(--ink-2); margin: 0 0 18px; font-size: 14px; }

  /* Forms */
  label.field { display: block; margin-bottom: 14px; }
  label.field > .lbl {
    display: block;
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px;
  }
  .input, select, textarea {
    width: 100%; padding: 14px 14px; font-size: 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px;
    font-family: inherit; color: var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-soft);
  }
  textarea { min-height: 70px; resize: vertical; }

  .times-list { display: flex; flex-direction: column; gap: 8px; }
  .time-row {
    display: flex; align-items: center; gap: 8px;
  }
  .time-row input[type=time] {
    flex: 1; padding: 12px 14px; font-size: 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; font-family: inherit; color: var(--ink);
  }
  .time-row .remove-time {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--rose-soft); color: #A8525A;
    border: none; display: grid; place-items: center;
    cursor: pointer; flex-shrink: 0;
  }
  .add-time {
    margin-top: 8px; background: transparent;
    border: 1px dashed var(--ink-3); color: var(--ink-2);
    padding: 10px; border-radius: 12px; width: 100%;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }

  /* Quick-fill schedule presets */
  .quick-fill {
    margin-bottom: 14px;
    padding: 12px;
    background: var(--bg-2);
    border-radius: 14px;
  }
  .qf-lbl {
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-2);
    margin-bottom: 8px;
  }
  .qf-chips {
    display: flex; gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 2px 2px 4px;
    margin: 0 -2px 10px;
    scrollbar-width: none;
  }
  .qf-chips::-webkit-scrollbar { display: none; }
  .qf-chip {
    flex-shrink: 0;
    padding: 8px 14px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-family: inherit; font-weight: 700; font-size: 13px;
    color: var(--ink); cursor: pointer;
    white-space: nowrap;
    transition: transform .12s ease, background .15s;
  }
  .qf-chip:active { transform: scale(.95); background: var(--primary-soft); }
  .qf-controls {
    display: flex; gap: 8px;
  }
  .qf-mini {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 12px; color: var(--ink-2); font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .qf-mini input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    font-family: inherit; font-size: 15px; font-weight: 700;
    color: var(--ink);
    padding: 2px 0;
    text-transform: none; letter-spacing: 0;
  }
  .qf-mini input[type=number] {
    width: 40px; flex: 0 0 40px;
    -moz-appearance: textfield;
    text-align: center;
  }
  .qf-mini input[type=number]::-webkit-outer-spin-button,
  .qf-mini input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }

  /* Color swatches */
  .swatches {
    display: flex; gap: 14px; flex-wrap: wrap;
    padding: 6px 4px;
  }
  .swatch {
    width: 48px; height: 48px; border-radius: 14px;
    cursor: pointer;
    display: grid; place-items: center;
    position: relative;
    outline: 3px solid transparent;
    outline-offset: 3px;
    transition: outline-color .18s ease, transform .18s ease;
  }
  .swatch::after {
    /* Tiny tag in the corner of unselected swatches so each one feels like a target */
    content: ''; position: absolute; inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    pointer-events: none;
  }
  .swatch svg {
    width: 24px; height: 24px;
    opacity: 0;
    transform: scale(.4) rotate(-30deg);
    transition: opacity .18s ease, transform .22s cubic-bezier(.3,1.4,.5,1);
    stroke-width: 3.2;
  }
  .swatch.selected {
    outline-color: var(--ink);
    transform: scale(1.08);
  }
  .swatch.selected svg {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
  .swatch:active { transform: scale(.95); }
  .swatch.selected:active { transform: scale(1.02); }

  /* Day chips */
  .day-chips {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  .day-chip {
    padding: 10px 0; border-radius: 12px; text-align: center;
    background: var(--card); border: 1px solid var(--line);
    font-weight: 700; font-size: 12px; cursor: pointer;
    color: var(--ink-2);
  }
  .day-chip.on {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 14px 18px;
    border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 700;

    -webkit-appearance: none;
  }
  .btn-primary {
    background: var(--primary); color: white;
    box-shadow: 0 4px 12px rgba(217,119,87,.3);
    width: 100%;
  }
  .btn-primary:active { transform: scale(.98); }
  .btn-ghost {
    background: var(--bg-2); color: var(--ink); width: 100%;
  }
  .btn-danger {
    background: var(--rose-soft); color: var(--danger-ink); width: 100%;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 8px; }

  /* Settings */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); margin-bottom: 10px;

  .setting-row .label { font-weight: 600; }
  .setting-row .desc { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .setting-row > div:first-child { flex: 1; padding-right: 12px; }

  /* Toggle */
  .toggle {
    width: 50px; height: 30px; border-radius: 30px;
    background: var(--line);
    position: relative; cursor: pointer;
    transition: background .2s; flex-shrink: 0;
  }
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: white;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
    transition: transform .2s;
  }
  .toggle.on { background: var(--sage); }
  .toggle.on::after { transform: translateX(20px); }

  /* Segmented control (theme picker) */
  .segment {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 4px; padding: 4px;
    background: var(--bg-2); border-radius: 13px;
  }
  .seg-opt {
    border: none; background: transparent;
    padding: 10px 8px; border-radius: 10px;
    font-family: inherit; font-weight: 700; font-size: 14px;
    color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;

  .seg-opt svg { width: 16px; height: 16px; }
  .seg-opt.on {
    background: var(--card); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06);
  }
  [data-theme="dark"] .seg-opt.on {
    box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
  }

  /* History */
  .history-day { margin-bottom: 18px; }
  .history-day .date-label {
    font-family: 'Fraunces', serif;
    font-weight: 500; font-size: 14px; color: var(--ink-2);

  .log-row {

  .banner-body button.cta {

    border: none; padding: 8px 14px; border-radius: 10px;

  }
  .banner.banner-info .cta {
    background: var(--banner-info-ink); color: var(--sky-soft);

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(110px + var(--safe-bottom));
    transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg);
    padding: 12px 18px; border-radius: 14px;

  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Stats row */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 12px; text-align: center;
  }
  .stat-card .v {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 22px; color: var(--ink);
  }
  .stat-card .l { font-size: 11px; color: var(--ink-2); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }

  /* Med detail */
  .med-detail-hero {
    text-align: center; padding: 8px 8px 16px;
  }
  .med-detail-hero .big-pill {
    width: 86px; height: 86px; margin: 0 auto 12px;

  .med-detail-hero h3 {
    font-family: 'Fraunces', serif; font-weight: 500;

  }
  .med-detail-hero .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }

  /* Utility */
  .row { display: flex; align-items: center; gap: 10px; }
  .spacer { flex: 1; }
  .muted { color: var(--ink-2); }
  small.hint { display: block; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
</style>

<script>
/* ========================================================================
 * Pillpal — local-only medication tracker PWA
 * ====================================================================== */

// --- Storage ---------------------------------------------------------------
const LS = {
  meds: 'pillpal.meds',
  log: 'pillpal.log',           // { id, medId, scheduledISO, takenISO|null, status }
  settings: 'pillpal.settings', // { notifications, dismissed: {} }
  notified: 'pillpal.notified', // map of "medId|YYYY-MM-DD|HH:mm" -> true
};

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

let meds = load(LS.meds, []);
let log = load(LS.log, []);
let settings = load(LS.settings, { notifications: false, dismissed: {} });
let notified = load(LS.notified, {});

// --- Color palette ---------------------------------------------------------
const PALETTE = [
  { id: 'coral',  bg: '#FCE7DD', fg: '#D97757' },
  { id: 'yellow', bg: '#FDF1D6', fg: '#D9A23A' },
  { id: 'sage',   bg: '#E2EEDF', fg: '#7FA88F' },
  { id: 'sky',    bg: '#DEEAEF', fg: '#5E8FA3' },
  { id: 'lilac',  bg: '#ECE4F2', fg: '#9D86B0' },
  { id: 'rose',   bg: '#F6DEDF', fg: '#C97078' },
];
const colorOf = (id) => PALETTE.find((p) => p.id === id) || PALETTE[0];

// --- Helpers ---------------------------------------------------------------
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

const uid = () => 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const pad2 = (n) => String(n).padStart(2, '0');

function fmtDateKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function parseDateKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtTime12(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const am = h < 12;
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}:${pad2(m)} ${am ? 'AM' : 'PM'}`;
}
function fmtRelativeDay(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(d); target.setHours(0,0,0,0);
  const diff = Math.round((target - today) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === -1) return 'Yesterday';
  if (diff === 1) return 'Tomorrow';
  return target.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
function fmtFullDate(d) {
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

// "selectedDate" is the date the user is currently viewing (defaults to today)
let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

function getGreeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Hello, night owl';
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  if (h < 21) return 'Good evening';
  return 'Hello, night owl';
}

// Get the scheduled doses for a given date and medication (PRN meds return [])
function dosesForDay(med, dateObj) {
  if (med.type === 'prn') return [];
  // Creation date — doses prior to creation don't count
  let createdMinutes = null;
  if (med.createdAt) {
    const created = new Date(med.createdAt);
    const createdDay = new Date(created.getFullYear(), created.getMonth(), created.getDate());
    if (dateObj < createdDay) return [];
    if (+dateObj === +createdDay) {
      createdMinutes = created.getHours() * 60 + created.getMinutes();
    }
  }
  // days: 'daily' or array of 0-6 (Sun..Sat)
  if (med.days !== 'daily' && Array.isArray(med.days)) {
    if (!med.days.includes(dateObj.getDay())) return [];
  }
  // start date check
  if (med.startDate) {
    const start = parseDateKey(med.startDate);
    if (dateObj < start) return [];
  }
  // end date check
  if (med.endDate) {
    const end = parseDateKey(med.endDate);
    if (dateObj > end) return [];
  }
  let times = med.times || [];
  if (createdMinutes !== null) {
    times = times.filter((t) => {
      const [h, mm] = t.split(':').map(Number);
      return h * 60 + mm >= createdMinutes;
    });
  }
  return times.map((t) => ({ time: t }));
}

// All scheduled (medId, time) for a given date, with dynamic "missed" auto-mark applied
function scheduleForDay(dateObj) {
  const dateKey = fmtDateKey(dateObj);
  const items = [];
  const autoMarkH = settings.autoMarkAfter || 0; // 0 = off
  const now = new Date();
  for (const m of meds) {
    for (const d of dosesForDay(m, dateObj)) {
      const logEntry = log.find((l) =>
        l.medId === m.id && l.scheduledISO && l.scheduledISO.startsWith(dateKey) && l.scheduledISO.includes(`T${d.time}`)
      );
      let status = logEntry ? logEntry.status : 'pending';
      let autoMarked = false;
      if (!logEntry && autoMarkH > 0) {
        const [h, mm] = d.time.split(':').map(Number);
        const scheduled = new Date(dateObj); scheduled.setHours(h, mm, 0, 0);
        if ((now - scheduled) / 3600000 >= autoMarkH) {
          status = 'missed';
          autoMarked = true;
        }
      }
      items.push({
        medId: m.id, med: m, time: d.time, status, autoMarked,
        logId: logEntry ? logEntry.id : null,
        takenISO: logEntry ? logEntry.takenISO : null,
      });
    }
  }
  return items.sort((a, b) => a.time.localeCompare(b.time));
}

// --- PRN (as-needed) helpers ---
function prnDoses(medId) {
  return log.filter((l) => l.medId === medId && !l.scheduledISO && l.takenISO);
}
function lastPRNDose(medId) {
  const arr = prnDoses(medId);
  if (!arr.length) return null;
  return arr.reduce((a, b) => new Date(a.takenISO) > new Date(b.takenISO) ? a : b);
}
function prnDosesOnDay(medId, dateObj) {
  const key = fmtDateKey(dateObj);
  return prnDoses(medId).filter((l) => l.takenISO.startsWith(key));
}
function prnStatusFor(med) {
  const last = lastPRNDose(med.id);
  const minMs = (med.minIntervalHours || 0) * 3600000;
  const todayCount = prnDosesOnDay(med.id, new Date()).length;
  const max = med.maxPerDay || 0;
  const now = new Date();
  let ready = true, waitMs = 0, nextAt = null;
  if (last && minMs > 0) {
    const elapsed = now - new Date(last.takenISO);
    if (elapsed < minMs) {
      ready = false;
      waitMs = minMs - elapsed;
      nextAt = new Date(new Date(last.takenISO).getTime() + minMs);
    }
  }
  const atMax = max > 0 && todayCount >= max;
  return { ready, atMax, last, nextAt, waitMs, todayCount, max };
}
function logPRNDose(medId) {
  log.push({ id: uid(), medId, status: 'taken', takenISO: new Date().toISOString() });
  save(LS.log, log);
}
function fmtAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m ago`;
  const h = Math.floor(min / 60);
  if (h < 24) return min % 60 ? `${h}h ${min % 60}m ago` : `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}
function fmtWait(ms) {
  const min = Math.max(1, Math.ceil(ms / 60000));
  if (min < 60) return `${min}m`;
  const h = Math.floor(min / 60);
  return min % 60 ? `${h}h ${min % 60}m` : `${h}h`;
}

// Mark dose taken/untaken
function markDose(medId, dateObj, time, status) {
  const dateKey = fmtDateKey(dateObj);
  const scheduledISO = `${dateKey}T${time}:00`;
  const existing = log.findIndex((l) => l.medId === medId && l.scheduledISO === scheduledISO);
  if (status === 'pending') {
    if (existing !== -1) log.splice(existing, 1);
  } else {
    const entry = {
      id: existing === -1 ? uid() : log[existing].id,
      medId, scheduledISO, status,
      takenISO: status === 'taken' ? new Date().toISOString() : null,
    };
    if (existing === -1) log.push(entry); else log[existing] = entry;
  }
  save(LS.log, log);
}

// --- SVG icons -------------------------------------------------------------
const ICON_PILL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(-35 12 12)"></rect>
  <line x1="7" y1="5" x2="17" y2="19" transform="rotate(-35 12 12)"></line>
</svg>`;
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="5 12 10 17 19 7"></polyline>
</svg>`;
const ICON_CHEV = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="9 6 15 12 9 18"></polyline>
</svg>`;
const ICON_TRASH = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <polyline points="3 6 5 6 21 6"></polyline>
  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
  <path d="M10 11v6M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
</svg>`;
const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <line x1="6" y1="6" x2="18" y2="18"></line><line x1="6" y1="18" x2="18" y2="6"></line>
</svg>`;
const ICON_CLOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline>
</svg>`;
const ICON_PLUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
  <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
</svg>`;

function pillIconEl(colorId, size = 46) {
  const c = colorOf(colorId);
  return `<div class="pill-icon" style="background:${c.bg}; color:${c.fg}; width:${size}px; height:${size}px;">${ICON_PILL}</div>`;
}

// --- Rendering: Today view -------------------------------------------------
function renderDayStrip() {
  const strip = $('#day-strip');
  strip.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  // Show today + previous 3 + next 3 (7 total) — week-of view starting Sunday is also OK,
  // but Huckleberry-style: show the current week centered around today
  const start = new Date(today);
  start.setDate(today.getDate() - today.getDay()); // Sunday
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const isToday = +d === +today;
    const isSelected = +d === +selectedDate;
    const has = scheduleForDay(d).length > 0;
    const dow = ['S','M','T','W','T','F','S'][d.getDay()];
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (isSelected ? ' today' : '') + (has ? ' has-doses' : '');
    cell.innerHTML = `<div class="dow">${dow}</div><div class="dom">${d.getDate()}</div>`;
    cell.addEventListener('click', () => {
      selectedDate = d;
      renderToday();
    });
    strip.appendChild(cell);
  }
}

function renderTodayStats() {
  const sched = scheduleForDay(selectedDate);
  const taken = sched.filter((s) => s.status === 'taken').length;
  const total = sched.length;
  const pending = sched.filter((s) => s.status === 'pending').length;
  const pct = total ? Math.round((taken / total) * 100) : 0;
  $('#today-stats').innerHTML = `
    <div class="stat-card"><div class="v">${taken}/${total}</div><div class="l">Taken</div></div>
    <div class="stat-card"><div class="v">${pending}</div><div class="l">Remaining</div></div>
    <div class="stat-card"><div class="v">${pct}%</div><div class="l">Complete</div></div>
  `;
}

function renderTodayList() {
  const list = $('#today-list');
  const sched = scheduleForDay(selectedDate);
  const today = new Date(); today.setHours(0,0,0,0);
  const isToday = +selectedDate === +today;

  $('#today-title').textContent = isToday ? 'Today' : fmtRelativeDay(selectedDate);
  $('#schedule-label').textContent = isToday ? "Today's schedule" : `${fmtFullDate(selectedDate)}'s schedule`;
  $('#greeting').textContent = isToday ? getGreeting() : 'Looking at';

  const prnMeds = isToday ? meds.filter((m) => m.type === 'prn') : [];
  const prnSection = prnMeds.length ? `
    <div class="section-title" style="margin-top:0;">As needed</div>
    <div id="prn-list">${prnMeds.map(renderPRNCardHTML).join('')}</div>
    ${sched.length ? '<div class="section-title">Scheduled</div>' : ''}
  ` : '';
  if (prnMeds.length > 0) $('#schedule-label').textContent = '';

  if (sched.length === 0 && prnMeds.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="blob">${pillIconEl('yellow', 56).replace('class="pill-icon"', 'class="pill-icon" style="background:transparent;color:#D9A23A;width:56px;height:56px;"')}</div>
        <h3>${meds.length ? 'A quiet day' : 'No medications yet'}</h3>
        <p>${meds.length ? "Nothing scheduled for this day." : "Tap the + button to add your first medication and set up reminders."}</p>
      </div>
    `;
    $('#schedule-label').textContent = '';
    return;
  }
  if (sched.length === 0) {
    list.innerHTML = prnSection;
    $('#schedule-label').textContent = '';
    bindPRNCards();
    return;
  }

  const now = new Date();
  const nowM = now.getHours() * 60 + now.getMinutes();

  const doseHTML = sched.map((s) => {
    const c = colorOf(s.med.color);
    const [hh, mm] = s.time.split(':').map(Number);
    const doseMin = hh * 60 + mm;
    let cls = '';
    let effective = s.status;
    if (s.status === 'taken') cls = 'taken';
    else if (s.status === 'skipped') cls = 'skipped';
    else if (s.status === 'missed') cls = 'missed';
    else if (isToday && doseMin < nowM - 15) { cls = 'missed'; effective = 'missed-display'; }
    const showSkip = (cls === 'missed' || effective === 'missed-display') && s.status !== 'skipped' && s.status !== 'taken';

    let subInfo = `<span>${escapeHTML(s.med.dosage || '1 dose')}</span>`;
    if (s.status === 'taken' && s.takenISO) {
      subInfo += `<span class="dot"></span><span>Taken ${new Date(s.takenISO).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>`;
    } else if (s.status === 'skipped') {
      subInfo += `<span class="dot"></span><span>Skipped</span>`;
    } else if (cls === 'missed') {
      subInfo += `<span class="dot"></span><span>${s.autoMarked ? 'Auto-marked missed' : 'Missed'}</span>`;
    }

    return `
      <div class="dose ${cls}" data-med="${s.med.id}" data-time="${s.time}">
        <div class="pill-icon" style="background:${c.bg}; color:${c.fg};">${ICON_PILL}</div>
        <div class="dose-meta">
          <div class="name">${escapeHTML(s.med.name)}</div>
          <div class="sub">${subInfo}</div>
        </div>
        <div class="dose-time">${fmtTime12(s.time)}</div>
        ${showSkip ? `<button class="skip-btn" aria-label="Mark as skipped">${ICON_X}</button>` : ''}
        <button class="check" aria-label="Mark as taken">${ICON_CHECK}</button>
      </div>
    `;
  }).join('');

  list.innerHTML = prnSection + doseHTML;
  bindPRNCards();

  // bind dose row clicks
  list.querySelectorAll('.dose').forEach((row) => {
    const medId = row.dataset.med;
    const time = row.dataset.time;
    row.querySelector('.check').addEventListener('click', (e) => {
      e.stopPropagation();
      const cur = scheduleForDay(selectedDate).find((s) => s.medId === medId && s.time === time);
      const newStatus = cur && cur.status === 'taken' ? 'pending' : 'taken';
      markDose(medId, selectedDate, time, newStatus);
      renderToday();
      if (newStatus === 'taken') toast('Nice — marked taken');
    });
    const skipBtn = row.querySelector('.skip-btn');
    if (skipBtn) {
      skipBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        markDose(medId, selectedDate, time, 'skipped');
        renderToday();
        toast('Marked as skipped');
      });
    }
    row.addEventListener('click', () => {
      const cur = scheduleForDay(selectedDate).find((s) => s.medId === medId && s.time === time);
      openDoseSheet(cur);
    });
  });
}

// PRN card rendering
function renderPRNCardHTML(med) {
  const c = colorOf(med.color);
  const s = prnStatusFor(med);
  let pillCls, pillText;
  if (s.atMax) { pillCls = 'locked'; pillText = `Daily limit (${s.todayCount}/${s.max})`; }
  else if (!s.ready) { pillCls = 'waiting'; pillText = `Wait ${fmtWait(s.waitMs)}`; }
  else { pillCls = 'ready'; pillText = 'Ready to take'; }

  const lastText = s.last ? `Last: ${new Date(s.last.takenISO).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} · ${fmtAgo(s.last.takenISO)}` : 'No doses yet';
  const countText = s.max > 0 ? `${s.todayCount} of ${s.max} today` : (s.todayCount > 0 ? `${s.todayCount} today` : '');

  const btnCls = s.atMax ? 'disabled' : (!s.ready ? 'waiting' : '');
  const btnLabel = s.atMax ? 'Done' : 'Take';
  return `
    <div class="prn-card" data-id="${med.id}">
      <div class="prn-top">
        <div class="pill-icon" style="background:${c.bg}; color:${c.fg};">${ICON_PILL}</div>
        <div class="prn-info">
          <div class="name">${escapeHTML(med.name)}</div>
          <div class="sub">${escapeHTML(med.dosage || 'As needed')}</div>
        </div>
        <button class="prn-take ${btnCls}" data-id="${med.id}" ${s.atMax ? 'disabled' : ''}>${btnLabel}</button>
      </div>
      <div class="prn-bottom">
        <div class="status-pill ${pillCls}"><span class="dot"></span>${pillText}</div>
        <div class="prn-meta">${lastText}${countText ? ' · ' + countText : ''}</div>
      </div>
    </div>
  `;
}

function bindPRNCards() {
  document.querySelectorAll('.prn-card').forEach((card) => {
    const id = card.dataset.id;
    const med = meds.find((m) => m.id === id);
    if (!med) return;
    const btn = card.querySelector('.prn-take');
    if (btn && !btn.disabled) {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = prnStatusFor(med);
        if (!s.ready) {
          openConfirmSheet({
            title: `Take ${med.name} now?`,
            body: `Your last dose was ${fmtAgo(s.last.takenISO)}. Recommended wait is ${med.minIntervalHours}h (${fmtWait(s.waitMs)} remaining).`,
            confirmLabel: 'Take anyway',
            danger: false,
            onConfirm: () => { logPRNDose(med.id); renderToday(); toast('Logged'); }
          });
        } else {
          logPRNDose(med.id);
          renderToday();
          toast(`Logged ${med.name}`);
        }
      });
    }
    card.addEventListener('click', (e) => {
      if (e.target.closest('.prn-take')) return;
      openPRNDetail(med);
    });
  });
}

function openPRNDetail(med) {
  const c = colorOf(med.color);
  const s = prnStatusFor(med);
  const today = new Date();
  const todayDoses = prnDosesOnDay(med.id, today).sort((a, b) => new Date(b.takenISO) - new Date(a.takenISO));
  const statusLine = s.atMax ? `Daily limit reached (${s.todayCount}/${s.max})`
    : !s.ready ? `Wait ${fmtWait(s.waitMs)} before next dose`
    : 'Ready to take';

  openSheet(`
    <div class="med-detail-hero">
      <div class="big-pill" style="background:${c.bg}; color:${c.fg};">${ICON_PILL}</div>
      <h3>${escapeHTML(med.name)}</h3>
      <div class="sub">${escapeHTML(med.dosage || 'As needed')}</div>
    </div>

    <div class="card">
      <div style="font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:6px;">Status</div>
      <div style="font-weight:600;">${statusLine}</div>
      <div style="margin-top:4px; color:var(--ink-2); font-size:14px;">
        Min interval: ${med.minIntervalHours || 0}h${med.maxPerDay ? ` · Max ${med.maxPerDay}/day` : ''}
      </div>
    </div>

    ${todayDoses.length ? `
      <div class="card">
        <div style="font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:8px;">Today's doses (${todayDoses.length})</div>
        ${todayDoses.map((d, i) => `
          <div class="row" style="padding:6px 0; ${i ? 'border-top:1px solid var(--line);' : ''}">
            <span style="font-family:'Fraunces',serif; font-weight:500;">${new Date(d.takenISO).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span>
            <span class="muted" style="margin-left:8px;">${fmtAgo(d.takenISO)}</span>
            <span class="spacer"></span>
            <button class="btn btn-ghost" style="width:auto; padding:6px 10px; font-size:13px;" data-undo="${d.id}">Undo</button>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="prn-take-now" ${s.atMax ? 'disabled' : ''}>${s.atMax ? 'Daily limit reached' : 'Take a dose now'}</button>
      <button class="btn btn-ghost" id="prn-edit" style="margin-top:8px;">Edit medication</button>
      <button class="btn btn-ghost" id="prn-close" style="margin-top:8px;">Close</button>
    </div>
  `);

  $('#prn-take-now').addEventListener('click', () => {
    if (s.atMax) return;
    if (!s.ready) {
      closeSheet();
      setTimeout(() => openConfirmSheet({
        title: `Take ${med.name} now?`,
        body: `Last dose was ${fmtAgo(s.last.takenISO)}. Recommended wait is ${med.minIntervalHours}h.`,
        confirmLabel: 'Take anyway',
        onConfirm: () => { logPRNDose(med.id); renderToday(); toast('Logged'); }
      }), 300);
    } else {
      logPRNDose(med.id);
      closeSheet();
      renderToday();
      toast('Logged');
    }
  });
  $('#prn-edit').addEventListener('click', () => { closeSheet(); setTimeout(() => openMedForm(med), 300); });
  $('#prn-close').addEventListener('click', closeSheet);

  $('#sheet').querySelectorAll('[data-undo]').forEach((b) => {
    b.addEventListener('click', () => {
      const id = b.dataset.undo;
      log = log.filter((l) => l.id !== id);
      save(LS.log, log);
      closeSheet();
      renderToday();
      toast('Removed');
    });
  });
}

function renderToday() {
  renderDayStrip();
  renderTodayStats();
  renderTodayList();
  renderPermissionBanner();
  renderInstallBanner();
}

// --- Banners --------------------------------------------------------------
function renderPermissionBanner() {
  const wrap = $('#permission-banner');
  wrap.innerHTML = '';
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') return;
  if (Notification.permission === 'denied') return;
  if (settings.dismissed.notif) return;
  if (meds.length === 0) return;

  wrap.innerHTML = `
    <div class="banner">
      <div style="font-size:22px;">🔔</div>
      <div class="banner-body">
        <div class="t">Enable reminders</div>
        <div class="d">Get a gentle nudge when it's time for a dose.</div>
        <button class="cta" id="banner-enable">Turn on notifications</button>
      </div>
      <button class="x" aria-label="Dismiss" id="banner-dismiss">✕</button>
    </div>
  `;
  $('#banner-enable').addEventListener('click', enableNotifications);
  $('#banner-dismiss').addEventListener('click', () => {
    settings.dismissed.notif = true; save(LS.settings, settings); renderPermissionBanner();
  });
}

function renderInstallBanner() {
  const wrap = $('#ios-install-banner');
  wrap.innerHTML = '';
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isStandalone) return;
  if (settings.dismissed.install) return;
  if (!isIOS) return; // Android gets the native install prompt elsewhere

  wrap.innerHTML = `
    <div class="banner banner-info">
      <div style="font-size:22px;">📲</div>
      <div class="banner-body">
        <div class="t">Install Pillpal</div>
        <div class="d">Tap the Share button in Safari, then "Add to Home Screen." Required on iPhone for reminders to work in the background.</div>
      </div>
      <button class="x" id="install-dismiss" aria-label="Dismiss">✕</button>
    </div>
  `;
  $('#install-dismiss').addEventListener('click', () => {
    settings.dismissed.install = true; save(LS.settings, settings); renderInstallBanner();
  });
}

      <div class="empty">
        <div class="blob">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#D97757" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="9" width="20" height="6" rx="3" transform="rotate(-35 12 12)"></rect>
            <line x1="7" y1="5" x2="17" y2="19" transform="rotate(-35 12 12)"></line>

        : (m.days || []).map((d) => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ') || 'No days set';

        <div class="meta">

// --- History view ----------------------------------------------------------
function renderHistory() {
  const summary = $('#adherence-summary');
  const list = $('#history-list');

  // 7-day adherence (scheduled meds only)
  const today = new Date(); today.setHours(0,0,0,0);
  let scheduled = 0, taken = 0, prnCount = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const sch = scheduleForDay(d);
    scheduled += sch.length;
    taken += sch.filter((s) => s.status === 'taken').length;
    for (const m of meds.filter((x) => x.type === 'prn')) {
      prnCount += prnDosesOnDay(m.id, d).length;
    }
  }
  const pct = scheduled ? Math.round((taken / scheduled) * 100) : 0;
  const hasScheduled = meds.some((m) => m.type !== 'prn');
  const hasPRN = meds.some((m) => m.type === 'prn');
  summary.innerHTML = `
    <div class="stats-row" style="margin-bottom:18px;">
      ${hasScheduled ? `<div class="stat-card"><div class="v">${pct}%</div><div class="l">7-day adherence</div></div>` : ''}
      <div class="stat-card"><div class="v">${taken + prnCount}</div><div class="l">Doses taken</div></div>
      ${hasScheduled ? `<div class="stat-card"><div class="v">${Math.max(0, scheduled - taken)}</div><div class="l">Missed</div></div>` : ''}
      ${hasPRN && !hasScheduled ? `<div class="stat-card"><div class="v">${prnCount}</div><div class="l">As-needed</div></div>` : ''}
    </div>
  `;

  // Group by day (last 30 days)
  if (meds.length === 0) {
    list.innerHTML = `<div class="empty"><h3>Nothing here yet</h3><p>Your dose history will appear here as you track meds.</p></div>`;
    return;
  }

  let html = '';
  let anyContent = false;
  const now = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const sch = scheduleForDay(d);
    // Collect PRN doses for this day
    const prnEntries = [];
    for (const m of meds.filter((x) => x.type === 'prn')) {
      for (const entry of prnDosesOnDay(m.id, d)) prnEntries.push({ entry, med: m });
    }
    if (sch.length === 0 && prnEntries.length === 0) continue;
    anyContent = true;

    // Merge into one sorted list (by time of day)
    const rows = [];
    for (const s of sch) {
      const [h, mm] = s.time.split(':').map(Number);
      const sortKey = h * 60 + mm;
      let displayStatus = s.status;
      if (displayStatus === 'pending') {
        const isPast = (d < today) || (+d === +today && sortKey < now.getHours() * 60 + now.getMinutes() - 15);
        if (isPast) displayStatus = 'missed';
      }
      const dotCls = displayStatus === 'taken' ? 'taken'
        : displayStatus === 'skipped' ? 'skipped'
        : displayStatus === 'missed' ? 'missed' : 'skipped';
      const statusText = displayStatus === 'taken'
        ? `Taken${s.takenISO ? ' at ' + new Date(s.takenISO).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''}`
        : displayStatus === 'missed' ? (s.autoMarked ? 'Auto-marked missed' : 'Missed')
        : displayStatus === 'skipped' ? 'Skipped'
        : 'Upcoming';
      rows.push({ sortKey, html: `
        <div class="log-row">
          <div class="status-dot ${dotCls}"></div>
          <div class="info">
            <div class="n">${escapeHTML(s.med.name)}</div>
            <div class="t">${escapeHTML(s.med.dosage || '')} · ${statusText}</div>
          </div>
          <div class="time">${fmtTime12(s.time)}</div>
        </div>
      ` });
    }
    for (const { entry, med } of prnEntries) {
      const takenDate = new Date(entry.takenISO);
      const sortKey = takenDate.getHours() * 60 + takenDate.getMinutes();
      const timeText = takenDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      rows.push({ sortKey, html: `
        <div class="log-row">
          <div class="status-dot taken"></div>
          <div class="info">
            <div class="n">${escapeHTML(med.name)}<span class="muted" style="font-weight:600; font-size:12px;"> · as needed</span></div>
            <div class="t">${escapeHTML(med.dosage || '')} · Taken at ${timeText}</div>
          </div>
          <div class="time">${timeText}</div>
        </div>
      ` });
    }
    rows.sort((a, b) => a.sortKey - b.sortKey);

    const dateLabel = fmtRelativeDay(d) + (i > 1 ? ` · ${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : '');
    html += `<div class="history-day"><div class="date-label">${dateLabel}</div>${rows.map((r) => r.html).join('')}</div>`;
  }
  list.innerHTML = anyContent ? html : `<div class="empty"><h3>No history yet</h3><p>Start tracking doses to build your history.</p></div>`;
}

// --- Settings view ---------------------------------------------------------
function renderSettings() {
  const list = $('#settings-list');
  const notifPerm = ('Notification' in window) ? Notification.permission : 'unsupported';
  const notifOn = settings.notifications && notifPerm === 'granted';
  const theme = settings.theme || 'auto';

        <button class="seg-opt ${(settings.autoMarkAfter||0)===0?'on':''}" data-v="0">Off</button>

  $('#theme-segment').querySelectorAll('.seg-opt').forEach((b) => {

      onConfirm: () => {

        localStorage.removeItem(LS.meds); localStorage.removeItem(LS.log);

// --- Sheets ----------------------------------------------------------------
function openSheet(html) {
  const sheet = $('#sheet');
  const bd = $('#sheet-backdrop');
  sheet.innerHTML = `<div class="grabber"></div>${html}`;
  bd.classList.add('open');
  requestAnimationFrame(() => sheet.classList.add('open'));
}
function closeSheet() {
  $('#sheet').classList.remove('open');
  $('#sheet-backdrop').classList.remove('open');
}
$('#sheet-backdrop').addEventListener('click', closeSheet);

// --- Add/Edit Med Form -----------------------------------------------------
function openMedForm(existing) {
  const m = existing || {
    id: uid(), name: '', dosage: '',
    type: 'scheduled',
    times: ['08:00'], days: 'daily',
    minIntervalHours: 4, maxPerDay: 0,
    color: 'coral', notes: ''
  };
  if (!m.type) m.type = 'scheduled';
  const isNew = !existing;
  let curType = m.type;

  openSheet(`
    <h2>${isNew ? 'New medication' : 'Edit medication'}</h2>
    <p class="lede">Choose how this one's tracked, then fill in the details.</p>

    <div class="type-select">
      <button type="button" class="type-opt ${curType === 'scheduled' ? 'on' : ''}" data-t="scheduled">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Scheduled
      </button>
      <button type="button" class="type-opt ${curType === 'prn' ? 'on' : ''}" data-t="prn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        As needed
      </button>
    </div>

    <label class="field">
      <span class="lbl">Name</span>
      <input class="input" id="f-name" placeholder="e.g. Vitamin D" value="${escapeAttr(m.name)}" autocomplete="off" />
    </label>

    <label class="field">
      <span class="lbl">Dosage</span>
      <input class="input" id="f-dosage" placeholder="e.g. 1 tablet, 500 mg" value="${escapeAttr(m.dosage)}" autocomplete="off" />
    </label>

    <div id="f-scheduled-fields" style="${curType === 'prn' ? 'display:none;' : ''}">
      <div class="field">
        <span class="lbl">Reminder times</span>

        <div class="quick-fill">
          <div class="qf-lbl">Quick fill</div>
          <div class="qf-chips">
            <button class="qf-chip" data-qf="1x" type="button">Once daily</button>
            <button class="qf-chip" data-qf="2x" type="button">Twice daily</button>
            <button class="qf-chip" data-qf="3x" type="button">3× daily</button>
            <button class="qf-chip" data-qf="4x" type="button">4× daily</button>
            <button class="qf-chip" data-qf="every" type="button">Every N hrs</button>
          </div>
          <div class="qf-controls">
            <label class="qf-mini">Start <input type="time" id="qf-start" value="08:00" /></label>
            <label class="qf-mini">Every <input type="number" id="qf-interval" min="1" max="23" value="6" />h</label>
          </div>
        </div>

        <div class="times-list" id="f-times"></div>
        <button class="add-time" id="f-add-time" type="button">+ Add another time</button>
      </div>

      <div class="field">
        <span class="lbl">Days</span>
        <div class="row" style="margin-bottom:10px; gap:8px;">
          <button type="button" class="day-chip ${m.days === 'daily' ? 'on' : ''}" id="f-daily" style="flex:1;">Every day</button>
          <button type="button" class="day-chip ${m.days !== 'daily' ? 'on' : ''}" id="f-custom" style="flex:1;">Specific days</button>
        </div>
        <div class="day-chips" id="f-days" style="${m.days === 'daily' ? 'display:none;' : ''}"></div>
      </div>
    </div>

    <div id="f-prn-fields" style="${curType !== 'prn' ? 'display:none;' : ''}">
      <label class="field">
        <span class="lbl">Minimum hours between doses</span>
        <input class="input" id="f-prn-interval" type="number" min="0" max="24" step="0.5" value="${m.minIntervalHours || 4}" />
        <small class="hint">You'll be told when it's safe to take again.</small>
      </label>
      <label class="field">
        <span class="lbl">Max doses per day (optional)</span>
        <input class="input" id="f-prn-max" type="number" min="0" max="24" value="${m.maxPerDay || ''}" placeholder="No limit" />
        <small class="hint">Leave blank for no limit.</small>
      </label>
    </div>

    <div class="field">
      <span class="lbl">Color</span>
      <div class="swatches" id="f-swatches"></div>
    </div>

    <label class="field">
      <span class="lbl">Notes (optional)</span>
      <textarea class="input" id="f-notes" placeholder="e.g. Take with food">${escapeHTML(m.notes || '')}</textarea>
    </label>

    <button class="btn btn-primary" id="f-save">${isNew ? 'Add medication' : 'Save changes'}</button>
    ${isNew ? '' : '<button class="btn btn-danger" id="f-delete" style="margin-top:8px;">Delete medication</button>'}
    <button class="btn btn-ghost" id="f-cancel" style="margin-top:8px;">Cancel</button>
  `);

  // Times
  let times = [...m.times];
  function renderTimes() {
    $('#f-times').innerHTML = times.map((t, i) => `
      <div class="time-row">
        <input type="time" value="${t}" data-i="${i}" />
        ${times.length > 1 ? `<button class="remove-time" data-i="${i}" aria-label="Remove time">${ICON_TRASH}</button>` : ''}
      </div>
    `).join('');
    $$('#f-times input[type=time]').forEach((inp) => {
      inp.addEventListener('change', (e) => { times[+inp.dataset.i] = e.target.value; });
    });
    $$('#f-times .remove-time').forEach((b) => {
      b.addEventListener('click', () => { times.splice(+b.dataset.i, 1); renderTimes(); });
    });
  }
  renderTimes();
  $('#f-add-time').addEventListener('click', () => { times.push('12:00'); renderTimes(); });

  // Quick-fill presets
  function genTimes(preset, startHHMM, intervalHrs) {
    const [sh, sm] = startHHMM.split(':').map(Number);
    if (Number.isNaN(sh)) return [];
    const startMin = sh * 60 + sm;
    let count, intervalMin;
    if (preset === '1x')      { count = 1; intervalMin = 24 * 60; }
    else if (preset === '2x') { count = 2; intervalMin = 12 * 60; }
    else if (preset === '3x') { count = 3; intervalMin = 8 * 60; }
    else if (preset === '4x') { count = 4; intervalMin = 6 * 60; }
    else {
      intervalMin = Math.max(1, intervalHrs) * 60;
      count = Math.max(1, Math.ceil(24 * 60 / intervalMin));
    }
    const out = [];
    for (let i = 0; i < count; i++) {
      const min = (startMin + i * intervalMin) % (24 * 60);
      out.push(`${pad2(Math.floor(min / 60))}:${pad2(min % 60)}`);
    }
    return [...new Set(out)].sort();
  }
  $$('.qf-chip').forEach((b) => {
    b.addEventListener('click', () => {
      const start = $('#qf-start').value || '08:00';
      const interval = Math.max(1, Math.min(23, parseInt($('#qf-interval').value, 10) || 6));
      times = genTimes(b.dataset.qf, start, interval);
      renderTimes();
      toast(`Set ${times.length} ${times.length === 1 ? 'time' : 'times'}`);
    });
  });

  // Days
  let days = m.days === 'daily' ? 'daily' : [...m.days];
  function renderDayChips() {
    const wrap = $('#f-days');
    const names = ['S','M','T','W','T','F','S'];
    wrap.innerHTML = names.map((n, i) => `<button class="day-chip ${Array.isArray(days) && days.includes(i) ? 'on' : ''}" data-d="${i}">${n}</button>`).join('');
    wrap.querySelectorAll('.day-chip').forEach((b) => {
      b.addEventListener('click', () => {
        const d = +b.dataset.d;
        if (!Array.isArray(days)) days = [];
        const idx = days.indexOf(d);
        if (idx === -1) days.push(d); else days.splice(idx, 1);
        days.sort();
        renderDayChips();
      });
    });
  }
  renderDayChips();

  $('#f-daily').addEventListener('click', () => {
    days = 'daily';
    $('#f-daily').classList.add('on'); $('#f-custom').classList.remove('on');
    $('#f-days').style.display = 'none';
  });
  $('#f-custom').addEventListener('click', () => {
    if (days === 'daily') days = [1,2,3,4,5];
    $('#f-custom').classList.add('on'); $('#f-daily').classList.remove('on');
    $('#f-days').style.display = 'grid';
    renderDayChips();
  });

  // Swatches
  const swWrap = $('#f-swatches');
  swWrap.innerHTML = PALETTE.map((p) => `
    <div class="swatch ${p.id === m.color ? 'selected' : ''}" data-c="${p.id}" style="background:${p.bg}; color:${p.fg};">
      ${ICON_CHECK}
    </div>
  `).join('');
  let selColor = m.color;
  swWrap.querySelectorAll('.swatch').forEach((s) => {
    s.addEventListener('click', () => {
      selColor = s.dataset.c;
      swWrap.querySelectorAll('.swatch').forEach((x) => x.classList.toggle('selected', x.dataset.c === selColor));
    });
  });

  // Type toggle
  $$('.type-opt').forEach((b) => {
    b.addEventListener('click', () => {
      curType = b.dataset.t;
      $$('.type-opt').forEach((x) => x.classList.toggle('on', x.dataset.t === curType));
      $('#f-scheduled-fields').style.display = curType === 'prn' ? 'none' : '';
      $('#f-prn-fields').style.display = curType === 'prn' ? '' : 'none';
    });
  });

  // Save
  $('#f-save').addEventListener('click', () => {
    const name = $('#f-name').value.trim();
    if (!name) { toast('Please enter a name'); return; }

    let updated;
    if (curType === 'prn') {
      const interval = parseFloat($('#f-prn-interval').value) || 0;
      const max = parseInt($('#f-prn-max').value, 10) || 0;
      if (interval < 0 || interval > 24) { toast('Interval must be 0–24 hours'); return; }
      updated = {
        id: m.id, name, type: 'prn',
        dosage: $('#f-dosage').value.trim(),
        minIntervalHours: interval,
        maxPerDay: max > 0 ? max : 0,
        color: selColor,
        notes: $('#f-notes').value.trim(),
        createdAt: m.createdAt || new Date().toISOString(),
      };
    } else {
      if (times.length === 0) { toast('Add at least one time'); return; }
      if (Array.isArray(days) && days.length === 0) { toast('Pick at least one day'); return; }
      updated = {
        id: m.id, name, type: 'scheduled',
        dosage: $('#f-dosage').value.trim(),
        times: [...new Set(times)].sort(),
        days, color: selColor,
        notes: $('#f-notes').value.trim(),
        createdAt: m.createdAt || new Date().toISOString(),
      };
    }

    const idx = meds.findIndex((x) => x.id === updated.id);
    if (idx === -1) meds.push(updated); else meds[idx] = updated;
    save(LS.meds, meds);
    closeSheet();
    toast(isNew ? 'Medication added' : 'Saved');
    renderAll();
    if (isNew && curType === 'scheduled' && !settings.notifications && Notification.permission === 'default') {
      setTimeout(() => { renderPermissionBanner(); }, 400);
    }
  });

  $('#f-cancel').addEventListener('click', closeSheet);
  if (!isNew) {
    $('#f-delete').addEventListener('click', () => {
      openConfirmSheet({
        title: `Delete "${m.name}"?`,
        body: 'This will also remove its dose history.',
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: () => {
          meds = meds.filter((x) => x.id !== m.id);
          log = log.filter((x) => x.medId !== m.id);
          save(LS.meds, meds); save(LS.log, log);
          closeSheet(); toast('Deleted'); renderAll();
        }
      });
    });
  }
}
